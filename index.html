<style>
:root{--bg:#000;--ink:#f5f5f7;--ink2:#8e8e93;--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.03);--edge:rgba(255,255,255,.16);--hi:rgba(255,255,255,.28);--sh:rgba(0,0,0,.7)}

*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .6s}

.go{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}.go svg{stroke:var(--bg);width:18px;stroke-width:2.6;stroke-linejoin:round}

.chip:hover{transform:translateY(-3px) scale(1.04)}@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.95)}}

/* galaxy */

.stage{position:fixed;inset:calc(86px + env(safe-area-inset-top,0px)) 0 calc(46vh + 14px) 0;container-type:size;transform:scale(.9)}
.panel{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom,0px));height:46vh;border-radius:30px;padding:24px 24px 40px;overflow:auto;transform:translateY(60px);z-index:4}
@media(min-width:900px){.stage{inset:calc(86px + env(safe-area-inset-top,0px)) 480px 0 0}.panel{left:auto;top:calc(86px + env(safe-area-inset-top,0px));width:460px;height:auto;transform:translateX(60px);bottom:44px}}
.trail{position:absolute;left:16px;right:16px;top:0;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;z-index:2;font-size:13px;color:var(--ink2);pointer-events:auto}

.orbit{--sun:clamp(70px,20cqmin,150px);--ps:clamp(40px,8cqmin,74px);--R1:calc(var(--sun)/2 + var(--ps)/2 + 14px);--R2:calc(var(--R1) + var(--ps) + 26px);position:absolute;inset:0;transition:opacity .35s,transform .45s,filter .35s}

.sun{position:absolute;left:50%;top:50%;translate:-50% -50%;width:var(--sun);height:var(--sun);font-size:calc(var(--sun)*.4);border:2px solid var(--hi);animation:pulse 3.2s ease-out infinite,born 1s cubic-bezier(.2,1.2,.3,1) .1s backwards}

.pos{position:absolute;left:0;top:0;transform:rotate(var(--a)) translateX(var(--R));animation:out 1.1s cubic-bezier(.2,1,.3,1) calc(.4s + var(--d)) backwards}
@keyframes out{from{transform:rotate(var(--a)) translateX(0) scale(.2);opacity:0}}
.cn{transform:rotate(calc(-1*var(--a)))}

.im{width:var(--ps);height:var(--ps);font-size:calc(var(--ps)*.4);border:2px solid var(--edge);box-shadow:0 10px 30px -8px var(--sh);transition:transform .3s cubic-bezier(.2,1.3,.3,1),box-shadow .3s}

.ring:hover,.ring:hover .nd{animation-play-state:paused}
/* panel */

.panel h3{margin:24px 0 10px;font-size:13px;font-weight:600;color:var(--ink2)}

/* v8 */

const STOP=new Set('the of and a an in on to for with is was are were as by at from that this it its be or which has have had not but also their his her they he she who whom more most other than into such can may been after before during between about over under there where when while these those first later many both each however'.split(' '));
function digest(raw,title){

  const S=(text.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[text]).map(s=>s.trim()),f={};
  const ws=s=>s.toLowerCase().match(/[a-z][a-z'-]{3,}/g)||[];
  ws(text).forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1});
  const top=S.map((s,i)=>{const w=ws(s);let x=w.reduce((a,t)=>a+(f[t]||0),0)/Math.pow(w.length||1,.6);if(i<2)x*=1.6;if(s.length<45||s.length>340)x*=.25;return[i,x]})
    .sort((a,b)=>b[1]-a[1]).slice(0,4).map(a=>a[0]).sort((a,b)=>a-b).map(i=>S[i]);
  const caps={};(text.match(/\b[A-Z][a-z]+(?: [A-Z][a-z]+)+\b/g)||[]).forEach(c=>caps[c]=(caps[c]||0)+1);
  const terms=Object.entries(caps).sort((a,b)=>b[1]-a[1]).map(a=>a[0]).filter(c=>c!==title&&!title.includes(c)).slice(0,7);
  Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,12).map(a=>a[0]).filter(w=>w.length>4&&!terms.some(t=>t.toLowerCase().includes(w))).slice(0,3).forEach(w=>terms.push(w[0].toUpperCase()+w.slice(1)));
  const tm=S.map(s=>[(s.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/)||[])[0],s]).filter(a=>a[0]).slice(0,4);
  return{top,terms,tm,mins:Math.max(1,Math.round(text.split(' ').length/220))}
}

function digest(raw,title){
  const text=raw.replace(/\n=+[^=\n]+=+\n/g,'\n').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
  const S=(text.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[text]).map(s=>s.trim()).slice(0,120),n=S.length;
  const tk=s=>new Set((s.toLowerCase().match(/[a-z][a-z'-]{3,}/g)||[]).filter(w=>!STOP.has(w)));

  const M=T.map((a,i)=>T.map((b,j)=>i===j?0:sim(a,b))),rs=M.map(r=>r.reduce((x,y)=>x+y,0));let r=new Array(n).fill(1/n);
  for(let k=0;k<20;k++)r=r.map((_,i)=>.15/n+.85*M.reduce((s,row,j)=>s+(rs[j]?row[i]/rs[j]*r[j]:0),0));
  const sc=r.map((v,i)=>v*(i<2?1.6:1)*(S[i].length<45||S[i].length>340?.2:1)),pk=[];
  [...sc.keys()].sort((a,b)=>sc[b]-sc[a]).forEach(i=>{if(pk.length<4&&pk.every(j=>sim(T[i],T[j])<.55))pk.push(i)});

  const caps={};(text.match(/\b[A-Z][a-z]+(?: [A-Z][a-z]+)+\b/g)||[]).forEach(c=>caps[c]=(caps[c]||0)+1);
  const terms=Object.entries(caps).sort((a,b)=>b[1]-a[1]).map(a=>a[0]).filter(c=>c!==title&&!title.includes(c)).slice(0,7);
  Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,12).map(a=>a[0]).filter(w=>w.length>4&&!terms.some(t=>t.toLowerCase().includes(w))).slice(0,3).forEach(w=>terms.push(w[0].toUpperCase()+w.slice(1)));

  return{top,terms,tm,mins:Math.max(1,Math.round(text.split(' ').length/220))}}
