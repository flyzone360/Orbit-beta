<style>

.tbtn{display:block;width:100%;margin:18px 0 0;padding:15px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.2,1.3,.3,1)}

<script>(()=>{const d=document.documentElement;if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(matchMedia('(pointer:coarse)').matches&&innerWidth<900))d.classList.add('mob');
const P={dom:15,fonts:10,load:30,net:30,gfx:15},got={};let tgt=0,cur=0,fin=false;

(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>set('fonts'));

const c=new AbortController(),to=setTimeout(()=>c.abort(),5000);

(function f(){cur+=Math.min(Math.max((tgt-cur)*.1,tgt>cur?.15:0),1.2);if(cur>tgt)cur=tgt;const n=Math.min(100,Math.round(cur));

 if(n>=100&&!fin){fin=true;el('sp').innerHTML='<b>Ready</b>';setTimeout(()=>{el('spl').classList.add('out');setTimeout(()=>el('spl').remove(),1000)},450);return}
 requestAnimationFrame(f)})()})()</script>

const STOP=new Set('the of and a an in on to for with is was are were as by at from that this it its be or which has have had not but also their his her they he she who whom more most other than into such can may been after before during between about over under there where when while these those first later many both each however'.split(' '));
function digest(raw,title){
  const text=raw.replace(/\n=+[^=\n]+=+\n/g,'\n').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
  const S=(text.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[text]).map(s=>s.trim()),f={};
  const ws=s=>s.toLowerCase().match(/[a-z][a-z'-]{3,}/g)||[];
  ws(text).forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1});
  const top=S.map((s,i)=>{const w=ws(s);let x=w.reduce((a,t)=>a+(f[t]||0),0)/Math.pow(w.length||1,.6);if(i<2)x*=1.6;if(s.length<45||s.length>340)x*=.25;return[i,x]})
    .sort((a,b)=>b[1]-a[1]).slice(0,4).map(a=>a[0]).sort((a,b)=>a-b).map(i=>S[i]);
  const caps={};(text.match(/\b[A-Z][a-z]+(?: [A-Z][a-z]+)+\b/g)||[]).forEach(c=>caps[c]=(caps[c]||0)+1);
  const terms=Object.entries(caps).sort((a,b)=>b[1]-a[1]).map(a=>a[0]).filter(c=>c!==title&&!title.includes(c)).slice(0,7);
  Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,12).map(a=>a[0]).filter(w=>w.length>4&&!terms.some(t=>t.toLowerCase().includes(w))).slice(0,3).forEach(w=>terms.push(w[0].toUpperCase()+w.slice(1)));
  const tm=S.map(s=>[(s.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/)||[])[0],s]).filter(a=>a[0]).slice(0,4);
  return{top,terms,tm,mins:Math.max(1,Math.round(text.split(' ').length/220))}
}

function yearOf(s){let m;

  if(m=s.match(/\b(\d{1,2})(?:st|nd|rd|th) century( BCE| BC)?/)){const n=+m[1]*100-50;return m[2]?[-n,m[1]+'th c. BC']:[n,m[1]+'th century']}

async function openTL(title){
  const my=++tvTok;cur=title;tv.className='tv on';scrEl.innerHTML='';scrEl.scrollTop=0;tv.setAttribute('aria-hidden','false');

    const texts=await Promise.all(pages.map(p=>ftext(p[0])));
    let ev=[];texts.forEach((t,i)=>{const e=parse(t,pages[i][1]);if(pages[i][1])e.splice(10);ev=ev.concat(e)});
    const seen=new Set();ev=ev.filter(e=>{const k=e.t.slice(0,45).toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
    const sc=e=>(e.list?2:0)+(CAUSE.test(e.t)?2:0)+(e.t.length>60&&e.t.length<230?1:0);

    try{if(navigator.share)await navigator.share({title:title,text});else{await navigator.clipboard.writeText(text);$('shr').textContent='Copied ✓'}}catch(e){}};
  if(MOB)snap('half')};
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q&&!document.body.classList.contains('dive')){e.preventDefault();q.focus()}});
